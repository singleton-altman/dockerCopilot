Name: dockerCopilot
Host: 0.0.0.0
Port: 12712
Timeout: 100000000000000
Log:
  Encoding: plain
Auth:
  AccessSecret: ${secretKey}
  AccessExpire: 7257600
ReleaseWatch:
  IntervalMinutes: ${RELEASE_WATCH_INTERVAL_MINUTES}
  GitHubToken: ${GITHUB_TOKEN}
  DataDir: ${DATA_DIR}
Compose:
  Dir: ${COMPOSE_DIR}
